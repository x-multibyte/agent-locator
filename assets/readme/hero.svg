<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Agent Locator (agloc) — AI Coding Agent Detector &amp; Skill Manager</title>
  <desc id="hero-desc">Detect 87 AI coding agents across your machine and manage shared skills from ~/.agent-locator/skills via symlink or copy modes using a TypeScript Ink TUI and Rust napi-rs core.</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="100%" stop-color="#101720"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="380" rx="20" fill="url(#bg-grad)"/>
  <rect x="1" y="1" width="1198" height="378" rx="19" fill="none" stroke="#243041" stroke-width="1.5"/>

  <!-- Left Column: Identity & Value -->
  <g id="title-block" transform="translate(52 48)">
    <!-- Category pill -->
    <rect x="0" y="0" width="296" height="32" rx="6" fill="#132233" stroke="#1E3A5F" stroke-width="1"/>
    <circle cx="18" cy="16" r="4.5" fill="#34D399"/>
    <text x="32" y="21.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="600" fill="#7DD3FC">CLI · INK TUI · RUST NAPI-RS</text>

    <!-- Project Name -->
    <text x="0" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="52" font-weight="800" letter-spacing="-1" fill="#F0F6FC">Agent Locator</text>
    <rect x="352" y="58" width="96" height="36" rx="8" fill="#16202C" stroke="#2B3B4E" stroke-width="1.2"/>
    <text x="400" y="82" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" font-weight="700" fill="#38BDF8">agloc</text>

    <!-- Value Proposition -->
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" fill="#C9D1D9">Detect 87 AI coding agents on your host and</text>
    <text x="0" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" fill="#C9D1D9">sync skills from one central hub via symlink or copy.</text>

    <!-- Accent divider -->
    <rect x="0" y="198" width="140" height="3" rx="1.5" fill="url(#accent-line)"/>

    <!-- Capability Metadata Pills -->
    <g transform="translate(0 226)">
      <rect x="0" y="0" width="128" height="36" rx="8" fill="#121923" stroke="#243041" stroke-width="1.2"/>
      <text x="64" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#E6EDF3">87 Agents</text>

      <rect x="142" y="0" width="166" height="36" rx="8" fill="#121923" stroke="#243041" stroke-width="1.2"/>
      <text x="225" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#E6EDF3">Symlink &amp; Copy</text>

      <rect x="322" y="0" width="154" height="36" rx="8" fill="#121923" stroke="#243041" stroke-width="1.2"/>
      <text x="399" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#E6EDF3">Doctor &amp; Sync</text>
    </g>
  </g>

  <!-- Right Column: Terminal Proof Panel -->
  <g id="terminal-proof" transform="translate(612 40)">
    <rect x="0" y="0" width="536" height="300" rx="12" fill="#121923" stroke="#243041" stroke-width="1.5"/>

    <!-- Terminal Title Bar -->
    <rect x="0" y="0" width="536" height="40" rx="12" fill="#17202C"/>
    <rect x="0" y="28" width="536" height="12" fill="#17202C"/>
    <line x1="0" y1="40" x2="536" y2="40" stroke="#243041" stroke-width="1"/>
    <circle cx="22" cy="20" r="5.5" fill="#F87171"/>
    <circle cx="42" cy="20" r="5.5" fill="#FBBF24"/>
    <circle cx="62" cy="20" r="5.5" fill="#34D399"/>
    <text x="268" y="25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" fill="#8B98A9">agloc — central hub &amp; matrix</text>

    <!-- Terminal Body -->
    <g transform="translate(22 66)">
      <!-- Command -->
      <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="700" fill="#38BDF8">$</text>
      <text x="18" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" fill="#E6EDF3">agloc skills list</text>

      <!-- Central Hub Header -->
      <text x="0" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="600" fill="#7DD3FC">Hub: ~/.agent-locator/skills</text>

      <!-- Agent Placement Rows -->
      <g transform="translate(0 58)">
        <rect x="0" y="0" width="492" height="40" rx="8" fill="#0E141C" stroke="#1E293B" stroke-width="1"/>
        <circle cx="18" cy="20" r="5" fill="#34D399"/>
        <text x="34" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="600" fill="#E6EDF3">Claude Code</text>
        <text x="200" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" fill="#38BDF8">symlink</text>
        <text x="394" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="600" fill="#34D399">[synced]</text>
      </g>

      <g transform="translate(0 106)">
        <rect x="0" y="0" width="492" height="40" rx="8" fill="#0E141C" stroke="#1E293B" stroke-width="1"/>
        <circle cx="18" cy="20" r="5" fill="#34D399"/>
        <text x="34" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="600" fill="#E6EDF3">Cursor</text>
        <text x="200" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" fill="#38BDF8">symlink</text>
        <text x="394" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="600" fill="#34D399">[synced]</text>
      </g>

      <g transform="translate(0 154)">
        <rect x="0" y="0" width="492" height="40" rx="8" fill="#0E141C" stroke="#1E293B" stroke-width="1"/>
        <circle cx="18" cy="20" r="5" fill="#FBBF24"/>
        <text x="34" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="600" fill="#E6EDF3">Codex</text>
        <text x="200" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" fill="#FBBF24">copy</text>
        <text x="382" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="600" fill="#FBBF24">[drifted]</text>
      </g>

      <!-- Footer hint -->
      <text x="0" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" fill="#8B98A9">Run `agloc skills doctor --fix` to repair drift &amp; links</text>
    </g>
  </g>
</svg>
